{% extends "base.html" %}
{% import "_icons.html" as icons %}
{% block title %}Neues Passwort{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        {{ icons.logo() }}
        <h1>Neues Passwort setzen</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="/reset-password/{{ token }}">
            <label>Neues Passwort (mindestens 8 Zeichen)<input type="password" name="password" minlength="8" required autofocus autocomplete="new-password"></label>
            <button type="submit">Passwort speichern</button>
        </form>
    </div>
</div>
{% endblock %}
