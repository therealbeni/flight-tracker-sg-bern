{% extends "base.html" %}
{% import "_icons.html" as icons %}
{% block title %}Set new password{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        {{ icons.logo() }}
        <h1>Set a new password</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="/reset-password/{{ token }}">
            <label>New password<input type="password" name="password" minlength="8" required autofocus autocomplete="new-password"></label>
            <button type="submit">Set password</button>
        </form>
    </div>
</div>
{% endblock %}
